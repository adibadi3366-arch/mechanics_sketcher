<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The figure in a LaTeX document</title>
<style>
  @font-face { font-family: "Barlow"; font-weight: 500; src: url("barlow-500.woff2") format("woff2"); }
  @font-face { font-family: "LM Mono"; src: url("lm-mono.woff2") format("woff2"); }
  html, body { margin: 0; height: 100%; }
  body { background: #2b2f2d; font-family: "Barlow", sans-serif; display: flex; gap: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; }
  .src { flex: 1 1 46%; background: #fbfbf8; border-right: 1px solid #c2cabf; }
  .out { flex: 1 1 54%; background: #d9dfd6; }
  .head { display: flex; align-items: center; justify-content: space-between; height: 46px; padding: 0 16px; background: #e7ebe5; border-bottom: 1px solid #c2cabf; color: #17201b; font-weight: 500; font-size: 15px; }
  .head .file { display: inline-flex; align-items: center; gap: 8px; }
  .head .file::before { content: ""; width: 10px; height: 12px; border: 1.5px solid #4c5850; border-radius: 1px; }
  button { font: 500 14.5px "Barlow", sans-serif; height: 32px; padding: 0 16px; border: 0; border-radius: 6px; background: #17201b; color: #fff; cursor: pointer; }
  button.busy { background: #4c5850; }
  pre { margin: 0; padding: 18px 20px; font: 15px/1.62 "LM Mono", monospace; color: #17201b; white-space: pre; overflow: hidden; flex: 1; }
  .cmd { color: #1b5ad1; }
  .com { color: #7a857d; }
  .math { color: #a3480d; }
  .typed { background: #fff6cf; }
  .caret { display: inline-block; width: 2px; height: 1.2em; margin-bottom: -0.25em; background: #17201b; animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .view { flex: 1; display: flex; align-items: flex-start; justify-content: center; padding: 22px; overflow: hidden; position: relative; }
  .page { position: absolute; top: 20px; left: 5%; width: 90%; background: #fff; box-shadow: 0 10px 28px -12px rgba(0,0,0,0.45); transition: opacity 0.35s ease; }
  .page img { display: block; width: 100%; }
  .page.after { opacity: 0; }
  .page.after.on { opacity: 1; }
  .status { font-size: 13.5px; color: #4c5850; font-weight: 500; }
</style>
</head>
<body>
<section class="pane src">
  <div class="head"><span class="file">main.tex</span><button id="compile" type="button">Compile</button></div>
<pre id="code"></pre>
</section>
<section class="pane out">
  <div class="head"><span class="file">main.pdf</span><span class="status" id="status">Compiled</span></div>
  <div class="view">
    <div class="page before"><img src="before.png" alt=""></div>
    <div class="page after" id="after"><img src="after.png" alt=""></div>
  </div>
</section>
<script>
  // The source, with the figure block still to be typed, marked by @@.
  const BEFORE = String.raw`\documentclass{article}
\usepackage{tikz}
\usetikzlibrary{arrows.meta, bending}

\begin{document}
\section*{Problem 3}
The truss in Figure~\ref{fig:truss} carries $F$ and
$F_2$ at its upper joints. Find the reactions at
the supports.
@@
\end{document}`;
  const FIGURE = String.raw`
\begin{figure}[h]
  \centering
  \input{truss.tex}
  \caption{A two-panel truss.}
  \label{fig:truss}
\end{figure}
`;
  const esc = (t) => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
  const colour = (t) => esc(t)
    .replace(/(%.*)$/gm, '<span class="com">$1</span>')
    .replace(/(\\[A-Za-z]+\*?)/g, '<span class="cmd">$1</span>')
    .replace(/(\$[^$\n]*\$)/g, '<span class="math">$1</span>');
  const code = document.getElementById("code");
  let typed = "";
  const draw = (caret) => {
    const [head, tail] = BEFORE.split("@@");
    code.innerHTML = colour(head) + (typed ? `<span class="typed">${colour(typed)}</span>` : "") + (caret ? '<span class="caret"></span>' : "") + colour(tail);
  };
  draw(false);
  window.typeFigure = (ms) => new Promise((done) => {
    let i = 0;
    const step = () => {
      typed = FIGURE.slice(0, ++i);
      draw(true);
      if (i < FIGURE.length) setTimeout(step, FIGURE[i - 1] === "\n" ? ms * 3 : ms);
      else { draw(false); done(); }
    };
    step();
  });
  document.getElementById("compile").addEventListener("click", () => {
    const b = document.getElementById("compile"), s = document.getElementById("status");
    b.classList.add("busy"); b.textContent = "Compiling…"; s.textContent = "Compiling…";
    setTimeout(() => {
      document.getElementById("after").classList.add("on");
      b.classList.remove("busy"); b.textContent = "Compile"; s.textContent = "Compiled";
    }, 900);
  });
</script>
</body>
</html>
